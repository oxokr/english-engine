<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="영어엔진">
<meta name="theme-color" content="#0A0A0C">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>영어 엔진</title>
<style>
  :root{
    --bg:#0A0A0C; --card:#15151B; --card2:#1C1C24; --line:#27272F;
    --txt:#F3F3F5; --dim:#8C8C95; --accent:#F5B14C; --accent-d:#1f1709;
    --ok:#46D39A; --no:#FF6B6B; --rev:#7AA2F7;
    --pad: max(20px, env(safe-area-inset-left));
    --safetop: max(calc(env(safe-area-inset-top) + 14px), 52px);
    --safebot: calc(env(safe-area-inset-bottom) + 12px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none;}
  html,body{margin:0; height:100%;}
  body{
    background:var(--bg); color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Apple SD Gothic Neo",sans-serif;
    -webkit-font-smoothing:antialiased; min-height:100dvh;
  }
  .screen{display:none; flex-direction:column; min-height:100dvh;
    padding:var(--safetop) var(--pad) var(--safebot);}
  .screen.on{display:flex;}

  .brand{font-size:15px; font-weight:700; letter-spacing:.12em; color:var(--dim);
         text-transform:uppercase; margin:6px 2px 18px;}
  .dday{background:linear-gradient(150deg,#211a0d,#15151B); border:1px solid #3a2f15;
        border-radius:24px; padding:24px 26px; margin-bottom:14px;}
  .dday .label{color:var(--dim); font-size:15px; font-weight:600;}
  .dday .num{font-size:54px; font-weight:800; letter-spacing:-.02em; line-height:1.05; margin-top:4px;}
  .dday .num b{color:var(--accent);}
  .dday .sub{color:var(--dim); font-size:14px; margin-top:8px;}
  .resume{width:100%; background:var(--accent); color:var(--accent-d); border:none;
    border-radius:18px; padding:20px; font-size:19px; font-weight:800; margin-bottom:12px; text-align:left;}
  .resume b{font-weight:900;}
  .tip{color:var(--dim); font-size:13px; line-height:1.5; margin:0 2px 18px;}

  .phase-h{font-size:13px; font-weight:700; letter-spacing:.1em; color:var(--accent);
           text-transform:uppercase; margin:22px 4px 12px;}
  .day-card{display:flex; align-items:center; gap:14px; width:100%; text-align:left;
    background:var(--card); border:1px solid var(--line); border-radius:18px;
    padding:18px 18px; margin-bottom:10px; color:var(--txt);}
  .day-card .no{font-size:13px; font-weight:800; color:var(--dim); width:46px; flex:none;}
  .day-card .verb{font-size:13px; font-weight:800; color:var(--accent-d); background:var(--accent);
    border-radius:8px; padding:4px 9px; flex:none;}
  .day-card .ti{font-size:17px; font-weight:600; flex:1;}
  .day-card .lock{font-size:12px; color:var(--dim); flex:none;}
  .day-card:not(.ready){opacity:.42;}
  .day-card.ready{border-color:#3a2f15;}
  .day-card.ready:active{background:var(--card2); transform:scale(.99);}
  .day-card .verb.muted{background:var(--line); color:var(--dim);}
  .day-card .lap{font-size:12px; font-weight:800; color:var(--accent); background:#2a2010;
    border:1px solid #3a2f15; border-radius:8px; padding:3px 8px; flex:none;}
  .pad-b{height:30px;}

  #intro{justify-content:center;}
  .topbar{display:flex; align-items:center; gap:14px; padding:2px 0 18px;}
  .back{background:var(--card); border:1px solid var(--line); color:var(--txt);
    width:48px; height:48px; border-radius:13px; font-size:22px; flex:none;}
  .topbar .crumb{font-size:15px; font-weight:700; color:var(--dim); letter-spacing:.02em;}
  .intro-body{flex:1; display:flex; flex-direction:column; justify-content:center; gap:24px; padding-bottom:30px;}
  .intro-verb{font-size:64px; font-weight:800; letter-spacing:-.02em; color:var(--accent);}
  .intro-verb small{display:block; font-size:17px; font-weight:700; color:var(--dim); letter-spacing:.08em; text-transform:uppercase; margin-bottom:6px;}
  .concept{font-size:23px; line-height:1.6; font-weight:500; color:var(--txt);}
  .intro-btns{display:flex; flex-direction:column; gap:12px; padding-bottom:26px;}

  .dhead{display:flex; align-items:center; gap:12px; padding:2px 0 12px; border-bottom:1px solid var(--line);}
  .dhead .crumb{flex:1; font-size:15px; font-weight:700; color:var(--dim);}
  .count{color:var(--dim); font-size:14px; font-variant-numeric:tabular-nums; font-weight:600;}
  .subrow{display:flex; align-items:center; justify-content:space-between; padding:12px 0 2px;}
  .modes{display:flex; gap:6px;}
  .modes button{background:transparent; color:var(--dim); border:1px solid var(--line);
    border-radius:999px; padding:9px 15px; font-size:14px; font-weight:700;}
  .modes button.on{background:var(--accent); color:var(--accent-d); border-color:var(--accent);}
  .auto{display:flex; align-items:center; gap:7px; color:var(--dim); font-size:14px; font-weight:600;}
  .auto input{width:20px; height:20px; accent-color:var(--accent);}

  .dmain{flex:1; display:flex; flex-direction:column; justify-content:center; gap:24px; padding:18px 0;}
  .tag{align-self:flex-start; color:var(--accent); font-size:13px; font-weight:800;
    letter-spacing:.04em; text-transform:lowercase; border:1px solid var(--accent);
    border-radius:9px; padding:4px 11px;}
  .tag.rev{color:var(--rev); border-color:var(--rev); text-transform:none;}
  .scene{align-self:flex-start; color:var(--rev); font-size:16px; font-weight:600;
    background:#11161f; border:1px solid #1f2a3d; border-radius:11px; padding:8px 13px; display:none;}
  .scene.show{display:block;}
  .ko{font-size:40px; font-weight:800; line-height:1.3; letter-spacing:-.01em;}

  .reveal-wrap{display:flex; flex-direction:column; gap:16px;}
  .bar{height:5px; background:var(--line); border-radius:999px; overflow:hidden;}
  .bar > i{display:block; height:100%; width:0%; background:var(--accent);}
  .en{font-size:33px; font-weight:700; line-height:1.4; min-height:46px;
    filter:blur(13px); opacity:.3; transition:filter .55s ease, opacity .55s ease;}
  .en.show{filter:blur(0); opacity:1;}
  .replay{align-self:flex-start; background:var(--card); border:1px solid var(--line);
    color:var(--txt); border-radius:13px; padding:11px 18px; font-size:15px; font-weight:600; display:none;}
  .replay.show{display:inline-block;}

  .slots{min-height:62px; display:flex; flex-wrap:wrap; gap:9px; align-content:flex-start;
    border-bottom:2px dashed var(--line); padding-bottom:14px;}
  .slots.ok{border-color:var(--ok);} .slots.no{border-color:var(--no);}
  .chips{display:flex; flex-wrap:wrap; gap:11px;}
  .chip{background:var(--card); border:1px solid var(--line); color:var(--txt);
    border-radius:15px; padding:14px 19px; font-size:21px; font-weight:700;}
  .chip.used{opacity:.22; pointer-events:none;}
  .placed{background:#241c0c; border:1px solid var(--accent); color:var(--txt);
    border-radius:15px; padding:14px 19px; font-size:21px; font-weight:700;}
  .verdict{font-size:17px; font-weight:700; min-height:22px;}
  .verdict.ok{color:var(--ok);} .verdict.no{color:var(--no);}
  .note{font-size:15px; line-height:1.55; color:var(--dim); background:var(--card);
    border:1px solid var(--line); border-left:3px solid var(--accent);
    border-radius:11px; padding:13px 15px; display:none;}
  .note.show{display:block;}

  footer{padding:14px 0 8px; border-top:1px solid var(--line); display:flex; gap:10px; align-items:stretch;}
  .big{flex:1; background:var(--accent); color:var(--accent-d); border:none; border-radius:17px;
    padding:20px; font-size:20px; font-weight:800;}
  .big:active{filter:brightness(.93);}
  .ghost{background:var(--card); color:var(--txt); border:1px solid var(--line);
    border-radius:17px; font-size:16px; font-weight:700;}
  .nav{flex:0 0 auto; padding:20px 16px;}
  .nav:active{background:var(--card2);}
  #ahint{position:fixed; left:12px; right:12px; bottom:calc(env(safe-area-inset-bottom) + 12px);
    background:var(--no); color:#1a0a0a; font-weight:700; text-align:center;
    padding:14px; border-radius:14px; display:none; z-index:50; font-size:15px;}
</style>
</head>
<body>

<section id="home" class="screen on">
  <div class="brand">영어 엔진</div>
  <div class="dday">
    <div class="label" id="ddayLabel">칸쿤 동굴 다이빙까지</div>
    <div class="num" id="ddayNum">D-—</div>
    <div class="sub" id="ddaySub">핵심동사 몇 개로, 출퇴근 20분.</div>
  </div>
  <button id="resumeBtn" class="resume" style="display:none"></button>
  <div class="tip">팁 · 아이폰 기본 알람을 평일 출근 시간에 반복으로 걸어두면 매일 잊지 않아요. 한국어가 나오면 3초 안에 소리 내서 말해보세요.</div>
  <div id="dayList"></div>
  <div class="pad-b"></div>
</section>

<section id="intro" class="screen">
  <div class="topbar">
    <button class="back" data-home>←</button>
    <div class="crumb" id="introCrumb">DAY 1</div>
  </div>
  <div class="intro-body">
    <div class="intro-verb"><small>오늘의 엔진</small><span id="introVerb">be</span></div>
    <div class="concept" id="introConcept">—</div>
  </div>
  <div class="intro-btns">
    <button class="ghost" id="introListen">🔊 개념 다시 듣기</button>
    <button class="big" id="introStart">연습 시작 ▶</button>
  </div>
</section>

<section id="drill" class="screen">
  <div class="dhead">
    <button class="back" data-home>←</button>
    <span class="crumb" id="drillCrumb">DAY 1 · be</span>
    <span class="count"><span id="cur">1</span> / <span id="total">0</span></span>
  </div>
  <div class="subrow">
    <div class="modes">
      <button id="mListen" class="on">🔊 듣기</button>
      <button id="mOrder">🧩 조용한 곳용</button>
    </div>
    <label class="auto"><input type="checkbox" id="autoChk" checked> 자동 넘김</label>
  </div>

  <div class="dmain">
    <div class="tag" id="tag">be</div>
    <div class="scene" id="scene"></div>
    <div class="ko" id="ko">—</div>

    <div class="reveal-wrap" id="listenUI">
      <div class="bar"><i id="barFill"></i></div>
      <div class="en" id="en">—</div>
      <button class="replay" id="replay">🔊 다시 듣기</button>
    </div>

    <div id="orderUI" style="display:none">
      <div class="slots" id="slots"></div>
      <div class="chips" id="chips"></div>
      <div class="verdict" id="verdict"></div>
    </div>

    <div class="note" id="note"></div>
  </div>

  <footer>
    <button class="ghost nav" id="prev">◀ 이전</button>
    <button class="big" id="playPause">⏸ 정지</button>
    <button class="ghost nav" id="next">다음 ▶</button>
  </footer>
</section>

<div id="ahint" onclick="this.style.display='none'">🔇 소리가 안 나면 화면을 한 번 탭하세요</div>

<script src="curriculum.js"></script>
<script>
const C = window.CURRICULUM;
const $ = s => document.querySelector(s);

// ===== 음성 =====
const audioEl = new Audio(); audioEl.preload = "auto";
function playSrc(src, onend){
  audioEl.pause(); audioEl.onended = onend || null;
  audioEl.onerror = ()=>{ if(onend) setTimeout(onend, 1000); };
  audioEl.src = src;
  const p = audioEl.play();
  if(p && p.then) p.then(()=>{ const h=document.getElementById("ahint"); if(h) h.style.display="none"; })
    .catch(()=>{ const h=document.getElementById("ahint"); if(h) h.style.display="block"; if(onend) setTimeout(onend, 1000); });
}
const clip = (id,lang)=> "audio/" + id + "_" + lang + ".mp3";
const sceneClip = id => "audio/" + id + "_scene.mp3";
const introSrc = day => "audio/d" + day.day + "_intro.mp3";

function savePos(){ try{ localStorage.setItem("ee_pos", JSON.stringify({d:dayIdx,i:idx})); }catch(e){} }
function loadLaps(){ try{ return JSON.parse(localStorage.getItem("ee_laps")||"{}"); }catch(e){ return {}; } }
function incLap(dnum){ const l=loadLaps(); l[dnum]=(l[dnum]||0)+1; try{ localStorage.setItem("ee_laps", JSON.stringify(l)); }catch(e){} }
function setMedia(){
  if(!("mediaSession" in navigator)) return;
  try{
    navigator.mediaSession.metadata = new MediaMetadata({ title: day ? ("DAY "+day.day+" · "+day.verb) : "영어 엔진", artist: "영어 엔진" });
    navigator.mediaSession.setActionHandler("play", ()=>{ if(paused) togglePlay(); });
    navigator.mediaSession.setActionHandler("pause", ()=>{ if(!paused) togglePlay(); });
    navigator.mediaSession.setActionHandler("nexttrack", ()=> nextItem());
    navigator.mediaSession.setActionHandler("previoustrack", ()=> prevItem());
  }catch(e){}
}

// ===== 화면 전환 =====
function show(name){ document.querySelectorAll(".screen").forEach(s=>s.classList.remove("on")); $("#"+name).classList.add("on"); window.scrollTo(0,0); }

// ===== 홈 =====
function dday(){
  const t = new Date(C.trip.start + "T00:00:00");
  const now = new Date(); now.setHours(0,0,0,0);
  return Math.round((t - now) / 86400000);
}
function renderHome(){
  const n = dday();
  $("#ddayLabel").textContent = C.trip.name + "까지";
  $("#ddayNum").innerHTML = n > 0 ? "D-<b>"+n+"</b>" : (n===0 ? "D-<b>DAY</b>" : "여행 후");
  const list = $("#dayList"); list.innerHTML = "";
  const laps = loadLaps();
  let phase = "";
  C.days.forEach((d,i)=>{
    if(d.phase !== phase){ phase = d.phase;
      const h = document.createElement("div"); h.className="phase-h"; h.textContent=phase; list.appendChild(h); }
    const b = document.createElement("button");
    b.className = "day-card" + (d.ready ? " ready" : "");
    const lap = laps[d.day] || 0;
    b.innerHTML =
      '<span class="no">DAY '+d.day+'</span>' +
      '<span class="verb'+(d.ready?'':' muted')+'">'+d.verb+'</span>' +
      '<span class="ti">'+d.title.replace(/^.*·\s*/,'')+'</span>' +
      (lap>0 ? '<span class="lap">'+lap+'회</span>' : '') +
      (d.ready ? '<span class="lock">▶</span>' : '<span class="lock">준비 중</span>');
    if(d.ready) b.onclick = ()=> openDay(i);
    list.appendChild(b);
  });
  try{
    const pos = JSON.parse(localStorage.getItem("ee_pos")||"null");
    const rb=document.getElementById("resumeBtn");
    if(pos && C.days[pos.d] && C.days[pos.d].ready){
      rb.style.display="block";
      rb.innerHTML = "이어듣기 ▶ &nbsp;<b>DAY "+C.days[pos.d].day+"</b> 이어서";
      rb.onclick=()=> resumeLast(pos);
    } else rb.style.display="none";
  }catch(e){}
}

// ===== 개념 =====
let dayIdx = 0, day = null, idx = 0, mode = "listen", timer = null, paused = false, sess = [];
function openDay(i){
  dayIdx = i; day = C.days[i];
  $("#introCrumb").textContent = "DAY " + day.day;
  $("#introVerb").textContent = day.verb;
  $("#introConcept").textContent = day.concept || "";
  show("intro");
  playSrc(introSrc(day));
}

// ===== 드릴 =====
const koEl=$("#ko"), enEl=$("#en"), tagEl=$("#tag"), barFill=$("#barFill");
const curEl=$("#cur"), totalEl=$("#total"), replayBtn=$("#replay");
const listenUI=$("#listenUI"), orderUI=$("#orderUI");
const slotsEl=$("#slots"), chipsEl=$("#chips"), verdictEl=$("#verdict"), autoChk=$("#autoChk");
const ppBtn=$("#playPause"), noteEl=$("#note"), sceneEl=$("#scene");

function setPP(){ ppBtn.textContent = paused ? "▶ 재생" : "⏸ 정지"; }
function togglePlay(){
  if(paused){ paused=false; setPP(); render(); }
  else {
    paused=true; audioEl.pause(); clearTimeout(timer);
    const w = getComputedStyle(barFill).width; barFill.style.transition="none"; barFill.style.width=w;
    setPP();
  }
}

// 세션 = 간격반복 복습 몇 문장(채점 없음) + 오늘 문장
function buildSession(){
  const rev=[];
  const pick=(arr,ixs)=> ixs.map(i=>arr[i % arr.length]).filter(Boolean);
  const prev=C.days[dayIdx-1], weekAgo=C.days[dayIdx-7];
  if(prev && prev.ready) pick(prev.items,[0,7,14]).forEach(it=> rev.push(Object.assign({},it,{_rev:true,tag:"복습"})));
  if(weekAgo && weekAgo.ready) pick(weekAgo.items,[3,11]).forEach(it=> rev.push(Object.assign({},it,{_rev:true,tag:"복습"})));
  sess = rev.concat(day.items);
}
function startDrill(){
  mode="listen"; paused=false; setPP();
  $("#mListen").classList.add("on"); $("#mOrder").classList.remove("on");
  $("#drillCrumb").textContent="DAY "+day.day+" · "+day.verb;
  buildSession(); idx=0; totalEl.textContent=sess.length;
  show("drill"); setMedia(); render();
}
function resumeLast(pos){
  dayIdx=pos.d; day=C.days[dayIdx];
  mode="listen"; paused=false; setPP();
  document.getElementById("mListen").classList.add("on"); document.getElementById("mOrder").classList.remove("on");
  document.getElementById("drillCrumb").textContent="DAY "+day.day+" · "+day.verb;
  buildSession(); idx=Math.min(pos.i, sess.length-1); totalEl.textContent=sess.length;
  show("drill"); setMedia(); render();
}
function curItem(){ return sess[idx]; }

function runListen(){
  const it = curItem();
  clearTimeout(timer);
  enEl.classList.remove("show"); replayBtn.classList.remove("show");
  barFill.style.transition="none"; barFill.style.width="0%";
  if(it.scene && !it._rev){ playSrc(sceneClip(it.id), ()=> playSrc(clip(it.id,"ko"), startCountdown)); }
  else playSrc(clip(it.id,"ko"), startCountdown);
}
function startCountdown(){
  if(paused) return;
  requestAnimationFrame(()=>{ barFill.style.transition="width 3s linear"; barFill.style.width="100%"; });
  timer = setTimeout(()=>{
    enEl.classList.add("show"); replayBtn.classList.add("show");
    const it = curItem();
    playSrc(clip(it.id,"en"), advanceMaybe);
  }, 3000);
}
function advanceMaybe(){ if(autoChk.checked && !paused) timer=setTimeout(nextItem, 1100); }

function norm(w){ return w.toLowerCase().replace(/[^a-z0-9']/g,""); }
function toks(en){ return en.split(/\s+/); }
function shuffle(a){ const r=a.slice(); for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; } return r; }
let chosen = [];
function runOrder(){
  const it = curItem();
  chosen = []; verdictEl.textContent=""; verdictEl.className="verdict"; slotsEl.className="slots";
  chipsEl.dataset.key = ""; playSrc(clip(it.id,"ko")); renderOrder();
}
function renderOrder(){
  const it = curItem(), T = toks(it.en);
  slotsEl.innerHTML="";
  chosen.forEach((w,i)=>{ const b=document.createElement("button"); b.className="placed"; b.textContent=w;
    b.onclick=()=>{ chosen.splice(i,1); renderOrder(); }; slotsEl.appendChild(b); });
  if(chipsEl.dataset.key!==it.en){ chipsEl.dataset.key=it.en; chipsEl._order=shuffle(T); }
  chipsEl.innerHTML="";
  chipsEl._order.forEach(w=>{ const b=document.createElement("button"); b.className="chip"; b.textContent=w;
    b.onclick=()=>{ chosen.push(w); renderOrder(); checkOrder(); }; chipsEl.appendChild(b); });
  let pool=chosen.slice();
  [...chipsEl.children].forEach(c=>{ const k=pool.indexOf(c.textContent); if(k>-1){ c.classList.add("used"); pool.splice(k,1); } });
}
function checkOrder(){
  const it = curItem(), T = toks(it.en);
  if(chosen.length < T.length) return;
  if(chosen.map(norm).join(" ") === T.map(norm).join(" ")){
    slotsEl.className="slots ok"; verdictEl.textContent="맞아요 ✓"; verdictEl.className="verdict ok";
    playSrc(clip(it.id,"en"), advanceMaybe);
  }else{
    slotsEl.className="slots no"; verdictEl.textContent="순서 다시 — 단어를 눌러 빼고 다시 놔봐"; verdictEl.className="verdict no";
  }
}
function render(){
  paused = false; setPP();
  const it = curItem();
  curEl.textContent = idx+1;
  tagEl.textContent = it.tag || day.verb;
  tagEl.className = "tag" + (it._rev ? " rev" : "");
  koEl.textContent = it.ko; enEl.textContent = it.en;
  if(it.scene && !it._rev){ sceneEl.textContent = "🎬 " + it.scene; sceneEl.classList.add("show"); }
  else { sceneEl.classList.remove("show"); }
  if(it.note){ noteEl.innerHTML = "💡 " + it.note; noteEl.classList.add("show"); }
  else { noteEl.classList.remove("show"); }
  clearTimeout(timer);
  if(mode==="listen"){ listenUI.style.display=""; orderUI.style.display="none"; runListen(); }
  else { orderUI.style.display=""; listenUI.style.display="none"; runOrder(); }
  savePos(); setMedia();
}
function nextItem(){ const wrap = idx+1 >= sess.length; idx=(idx+1)%sess.length; if(wrap && day) incLap(day.day); render(); }
function prevItem(){ idx=(idx-1+sess.length)%sess.length; render(); }

// ===== 이벤트 =====
document.querySelectorAll("[data-home]").forEach(b=> b.onclick=()=>{ clearTimeout(timer); audioEl.pause(); paused=false; show("home"); renderHome(); });
$("#introListen").onclick=()=> playSrc(introSrc(day));
$("#introStart").onclick=startDrill;
$("#next").onclick=nextItem;
$("#prev").onclick=prevItem;
ppBtn.onclick=togglePlay;

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
}
